<?xml version="1.0" encoding="UTF-8"?>
<!-- OpenBRC application icon: a lucky horseshoe with a sparkle. Original artwork, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ac0"/>
      <stop offset="1" stop-color="#d6337f"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.55" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e2a42a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>
  <!-- Horseshoe: a thick open ring, opening at the top (the lucky way up). -->
  <path d="M 150 140 L 150 286 A 106 106 0 0 0 362 286 L 362 140 L 300 140 L 300 286 A 44 44 0 0 1 212 286 L 212 140 Z"
        fill="url(#shoe)" stroke="#8a4b12" stroke-width="10" stroke-linejoin="round"/>
  <!-- Nail holes -->
  <g fill="#8a4b12">
    <circle cx="181" cy="172" r="9"/><circle cx="181" cy="232" r="9"/><circle cx="194" cy="318" r="9"/>
    <circle cx="331" cy="172" r="9"/><circle cx="331" cy="232" r="9"/><circle cx="318" cy="318" r="9"/>
  </g>
  <!-- Sparkle -->
  <path d="M 400 70 L 412 106 L 448 118 L 412 130 L 400 166 L 388 130 L 352 118 L 388 106 Z" fill="#ffffff"/>
  <circle cx="122" cy="122" r="12" fill="#ffffff" fill-opacity="0.85"/>
</svg>
